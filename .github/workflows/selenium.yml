name: Build and Test

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            browser: CHROME
          - os: ubuntu-latest
            browser: FIREFOX
          - os: macos-latest
            browser: SAFARI
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'
          cache: maven
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Cache Maven local repository
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-${{ matrix.browser }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Creating Env vars
        env:
          WAITFOR_TIME: ${{ vars.WAITFOR_TIME }}
          SUITE_XML_FILES: ${{ vars.SUITE_XML_FILES }}
          IS_DOCKER_NEEDED: ${{ vars.IS_DOCKER_NEEDED }}
        run: echo "print out suite xml $SUITE_XML_FILES"

      - name: Enable safaridriver (macOS only)
        if: matrix.browser == 'SAFARI'
        run: sudo safaridriver --enable

      - name: Test with Maven
        run: mvn test -Dsurefire.suiteXmlFiles=${{ vars.SUITE_XML_FILES }} -Dwaitfortime=${{ vars.WAITFOR_TIME }} -Ddocker=${{ vars.DOCKER }} -Dbrowser=${{ matrix.browser }}

      - name: Upload surefire report
        uses: actions/upload-artifact@v4
        with:
          name: surefire-report-${{ matrix.browser }}
          path: target/surefire-reports/emailable-report.html
