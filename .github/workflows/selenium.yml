name: Build and Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: maven

      - name: Prepare WebDriverManager Docker network
        run: docker network inspect grid >/dev/null 2>&1 || docker network create grid

      - name: Test with Maven
        run: >-
          mvn --batch-mode --no-transfer-progress test
          -Dsurefire.suiteXmlFiles=${{ vars.SUITE_XML_FILES || 'test_runner.xml' }}
          -DrunId=${{ github.run_id }}-${{ github.run_attempt }}
          -Dwaitfortime=${{ vars.WAITFOR_TIME || '45' }}
          -Ddocker=${{ vars.DOCKER || 'true' }}
          -Dheadless=true

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/**/*.jsonl
            screenshots/**
            target/surefire-reports/**
            extent-reports/**
          if-no-files-found: warn
